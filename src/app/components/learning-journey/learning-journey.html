<section class="section journey" aria-labelledby="journey-title">
  <div class="container">
    <div class="section-head centered">
      <span class="eyebrow on-dark">Your learning journey</span>
      <h2 id="journey-title" class="section-title text-white">From first lesson to first paid work</h2>
      <p class="section-sub">A clear path we follow with every student: learn, practise, build, work and grow.</p>
    </div>

    <ol class="steps">
      @for (step of steps; track step.title; let i = $index) {
        <li class="step">
          <span class="num">
            <i class="bi" [class]="step.icon" aria-hidden="true"></i>
          </span>
          <span class="idx">Step {{ i + 1 }}</span>
          <h3 class="h6">{{ step.title }}</h3>
          <p>{{ step.text }}</p>
        </li>
      }
    </ol>
  </div>
</section>
