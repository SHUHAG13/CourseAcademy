<section class="section" aria-labelledby="testimonials-title">
  <div class="container">
    <div class="section-head centered">
      <span class="eyebrow">Student stories</span>
      @if (asPage()) {
        <h1 id="testimonials-title" class="section-title">What our students say</h1>
      } @else {
        <h2 id="testimonials-title" class="section-title">What our students say</h2>
      }
      <p class="section-sub">
        <span class="tag">Demo content</span>
        Sample testimonials shown for demonstration until real student reviews are collected.
      </p>
    </div>

    <div class="row g-4">
      @for (t of testimonials; track t.name) {
        <div class="col-md-6 col-lg-4">
          <figure class="quote ca-card">
            <i class="bi bi-quote quote-mark" aria-hidden="true"></i>
            <app-rating-stars [rating]="t.rating" />
            <blockquote>{{ t.text }}</blockquote>
            <figcaption>
              <app-avatar [name]="t.name" [size]="44" />
              <div>
                <strong>{{ t.name }}</strong>
                <span>{{ t.course }}</span>
              </div>
            </figcaption>
            <p class="outcome"><i class="bi bi-arrow-up-right-circle" aria-hidden="true"></i>{{ t.outcome }}</p>
          </figure>
        </div>
      }
    </div>
  </div>
</section>
