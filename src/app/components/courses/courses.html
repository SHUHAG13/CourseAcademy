<section class="section bg-surface" aria-labelledby="featured-title">
  <div class="container">
    <div class="section-head-row">
      <div class="section-head">
        <span class="eyebrow">{{ 'Featured courses' | t }}</span>
        <h2 id="featured-title" class="section-title">{{ 'Most popular with our students' | t }}</h2>
        <p class="section-sub">{{ 'Practical, project-based courses taught in Bangla by working professionals.' | t }}</p>
      </div>
      <a routerLink="/courses" class="btn-link-arrow">{{ 'View all courses' | t }} <i class="bi bi-arrow-right" aria-hidden="true"></i></a>
    </div>

    <div class="tabs" role="tablist" [attr.aria-label]="'Filter featured courses' | t">
      <button type="button" role="tab" class="chip" [class.active]="active() === 'featured'"
        [attr.aria-selected]="active() === 'featured'" (click)="active.set('featured')">
        {{ 'Featured' | t }}
      </button>
      @for (cat of categories; track cat.id) {
        <button type="button" role="tab" class="chip" [class.active]="active() === cat.id"
          [attr.aria-selected]="active() === cat.id" (click)="active.set(cat.id)">
          {{ cat.name | t }}
        </button>
      }
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4" role="tabpanel">
      @for (course of courses(); track course.id) {
        <div class="col">
          <app-course-card [course]="course" />
        </div>
      }
    </div>
  </div>
</section>
