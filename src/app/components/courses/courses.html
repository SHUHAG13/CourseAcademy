<section class="py-5">

  <div class="container">

    <h2 class="mb-4">
      📚 সকল কোর্স
    </h2>

    <div class="row g-4">

      <div
        class="col-lg-3 col-md-6"
        *ngFor="let course of courses">

        <div class="card h-100 shadow-sm">

          <div class="card-body">

            <div class="fs-1">
              {{course.icon}}
            </div>

            <h5>
              {{course.title}}
            </h5>

            <h6 class="text-primary">
              ৳ {{course.price}}
            </h6>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>
