<section class="py-5 bg-white">

  <div class="container">

    <!-- Header -->
    <div class="text-center mb-5">

      <span class="badge bg-dark px-3 py-2">
        FAQ
      </span>

      <h2 class="fw-bold mt-3 text-dark">
        Frequently Asked Questions
      </h2>

      <p class="text-muted">
        Here are answers to the most common questions about the course.
      </p>

    </div>

    <!-- Accordion -->
    <div class="row justify-content-center">

      <div class="col-lg-8">

        <div class="accordion" id="faqAccordion">

          <div class="accordion-item border mb-3 rounded overflow-hidden"
               *ngFor="let faq of faqs; let i = index">

            <h2 class="accordion-header">

              <button
                class="accordion-button collapsed fw-semibold"
                type="button"
                data-bs-toggle="collapse"
                [attr.data-bs-target]="'#faq' + i"
                [attr.aria-controls]="'faq' + i">

                {{ faq.question }}

              </button>

            </h2>

            <div
              [id]="'faq' + i"
              class="accordion-collapse collapse"
              data-bs-parent="#faqAccordion">

              <div class="accordion-body text-muted">

                {{ faq.answer }}

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- CTA -->
    <div class="text-center mt-5">

      <h5 class="fw-bold text-dark">
        Didn’t find your answer?
      </h5>

      <p class="text-muted">
        Contact us via WhatsApp or Facebook Messenger for quick support.
      </p>

      <button class="btn btn-dark px-4">
        Contact Us
      </button>

    </div>

  </div>

</section>
