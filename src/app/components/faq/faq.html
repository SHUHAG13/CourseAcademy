<section class="faq-section py-5 bg-light">

  <div class="container">

    <div class="text-center mb-5">
      <span class="faq-badge">❓ Frequently Asked Questions</span>

      <h2 class="fw-bold mt-3">
        প্রায়শই জিজ্ঞাসিত প্রশ্নসমূহ
      </h2>

      <p class="text-muted">
        কোর্স সম্পর্কে আপনার সাধারণ প্রশ্নগুলোর উত্তর এখানে দেওয়া হয়েছে।
      </p>
    </div>

    <div class="row justify-content-center">

      <div class="col-lg-8">

        <div class="accordion shadow-sm" id="faqAccordion">

          <div
            class="accordion-item border-0 mb-3 rounded overflow-hidden"
            *ngFor="let faq of faqs; let i = index">

            <h2 class="accordion-header">

              <button
                class="accordion-button collapsed fw-semibold"
                type="button"
                data-bs-toggle="collapse"
                [attr.data-bs-target]="'#faq' + i"
                [attr.aria-controls]="'faq' + i">

                {{ faq.question }}

              </button>

            </h2>

            <div
              [id]="'faq' + i"
              class="accordion-collapse collapse"
              data-bs-parent="#faqAccordion">

              <div class="accordion-body">

                {{ faq.answer }}

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- Contact CTA -->

    <div class="faq-contact text-center mt-5">

      <h5 class="fw-bold">
        আপনার প্রশ্নের উত্তর খুঁজে পাননি?
      </h5>

      <p class="text-muted">
        আমাদের সাথে WhatsApp অথবা Facebook Messenger-এ যোগাযোগ করুন।
      </p>

      <button class="btn btn-primary px-4">
        যোগাযোগ করুন
      </button>

    </div>

  </div>

</section>
